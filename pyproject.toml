[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-unirate"
version = "0.1.0"
description = "Wagtail integration for the UniRate currency-exchange API — StreamField blocks, Django template tags, and a cached client wired through Django settings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unirate Team" }]
keywords = [
    "wagtail",
    "django",
    "unirate",
    "currency",
    "exchange-rates",
    "forex",
    "money",
    "fintech",
    "cms",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 5",
    "Framework :: Wagtail :: 6",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6.0",
    "wagtail>=5.2,<7.0",
    "unirate-api>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/UniRate-API/wagtail-unirate"
Repository = "https://github.com/UniRate-API/wagtail-unirate"
Issues = "https://github.com/UniRate-API/wagtail-unirate/issues"
Provider = "https://unirateapi.com"

[dependency-groups]
test = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "responses>=0.25,<1.0",
]
lint = [
    "ruff>=0.6,<1.0",
]
typing = [
    "mypy>=1.10,<2.0",
    "types-requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["wagtail_unirate"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["unirate", "unirate.*", "wagtail", "wagtail.*", "responses", "responses.*", "django.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "tests.unit_tests.settings"
